[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "databricks-lakehouse-sample"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["boto3>=1.40,<2", "psycopg[binary]>=3.2,<4"]
[project.optional-dependencies]
test = ["pytest==8.4.2", "pyspark==3.5.6", "delta-spark==3.3.2", "fastapi>=0.115,<1", "httpx>=0.27,<1", "PyYAML>=6,<7"]
service = ["fastapi>=0.115,<1", "confluent-kafka>=2.6,<3"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
lakehouse = ["contracts.json"]
