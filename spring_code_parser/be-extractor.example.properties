# be-code-parser: send settings (copy to be-extractor.properties and edit).
# No credentials belong here: the local Beyond Entity MCP server opens the project itself.

# --- Report language ------------------------------------------------------------------------------
# Security / PII reports and the finding texts written to BE: en (default), ko or ja
#report.language=en

# --- MCP connection -------------------------------------------------------------------------------
# Beyond Entity desktop MCP server executable (stdio)
mcp.command=/usr/local/bin/beyond-entity-mcp
mcp.timeout.seconds=120
# Keep the project database open across calls; beyond_batch_stop is sent at the end
mcp.batch_mode=true
# A project locked by another process (the desktop app, a reviewer): wait and retry
mcp.lock.retry_seconds=30
mcp.lock.max_retries=20

# --- Target ---------------------------------------------------------------------------------------
# BE project the parser writes to
target.project=PxxxxxxxxxxxX
# Development: projects the parser must never write to when batch runs loop over many projects (comma-separated)
#protected.projects=PyyyyyyyyyyyY,PzzzzzzzzzzzZ
# Actor recorded on checkpoints and analysis runs
checkpoint.actor=be-code-parser
# BE storage-type catalog (allowed data types per processor/entity type), validated before sending
be.schema=model_creation_schema.json

# --- Model scope ----------------------------------------------------------------------------------
# Also keep modules with no Spring role (plain libraries)
#extract.include_general_modules=false
# Key identifying the source repository across runs (default: repository name)
#analysis.repository_key=my-app

# --- Security findings ----------------------------------------------------------------------------
#security.findings.enabled=true
# Branch recorded with the security findings
#security.findings.branch=main
# Guard against resolving a large share of open findings in one send (override with --allow-mass-resolve)
#security.findings.mass_resolve.min=10
#security.findings.mass_resolve.ratio=0.3
# External catalog directory (default: bundled catalog)
#security.catalog.dir=/path/to/security-catalog

# --- Reports uploaded as BE documents -------------------------------------------------------------
#security.report.enabled=true
#security.report.file=security-check-<repo>.md
#pii.report.enabled=true
#pii.report.file=pii-flow-<repo>.md
